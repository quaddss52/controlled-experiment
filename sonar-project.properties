# SonarQube Project Configuration
# This file configures SonarQube analysis for participant submissions

# Project identification
sonar.projectKey=ai-code-experiment
sonar.projectName=AI Code Generation Experiment
sonar.projectVersion=1.0

# Source code location
sonar.sources=src/tasks
sonar.tests=src/tests

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.spec.ts,node_modules/**,dist/**,coverage/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reports (Jest generates LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ESLint report integration (optional)
# sonar.eslint.reportPaths=eslint-report.json

# Analysis parameters
sonar.scm.disabled=false

# Quality gate settings (optional - customize as needed)
# sonar.qualitygate.wait=false

# ============================================
# Per-Participant Configuration
# ============================================
# When running evaluation for specific participants, override these:
# sonar.projectKey=participant-P001-task-1
# sonar.projectName=Participant P001 - Task 1
#
# Use command-line parameters in evaluate.sh:
# sonar-scanner -Dsonar.projectKey=participant-${ID}-task-${N}

# ============================================
# SonarQube Server Connection
# ============================================
# Default: localhost (Docker/local installation)
sonar.host.url=http://localhost:9000

# Authentication (if required)
# Generate token at: http://localhost:9000/account/security
# sonar.login=your-token-here

# ============================================
# For SonarCloud (cloud-based alternative)
# ============================================
# Uncomment and configure if using SonarCloud:
# sonar.organization=your-organization
# sonar.host.url=https://sonarcloud.io
# sonar.login=your-sonarcloud-token
